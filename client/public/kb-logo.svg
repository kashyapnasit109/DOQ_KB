<!-- KB Monogram — "The Infrastructure K" 
     Three strata beams with diagonal cut forming the K
     B is letterformed by the concave right edge
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 88" fill="none">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14d9c5"/>
      <stop offset="100%" stop-color="#0f9580"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8edf2"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <!-- MONOGRAM: 3-strata K mark -->
  <g transform="translate(0,6)">
    <!-- Top beam (bridge deck) -->
    <rect x="0" y="0"  width="52" height="14" rx="1" fill="url(#tg)"/>
    <!-- Top diagonal -->
    <polygon points="52,0 72,0 52,14" fill="url(#tg)" opacity="0.7"/>
    <!-- Mid beam (foundation slab) -->
    <rect x="0" y="21" width="52" height="14" rx="1" fill="url(#tg)" opacity="0.85"/>
    <!-- Mid diagonals (chevron) -->
    <polygon points="52,21 72,21 52,28" fill="url(#tg)" opacity="0.5"/>
    <polygon points="52,35 72,35 52,28" fill="url(#tg)" opacity="0.5"/>
    <!-- Bottom beam (bedrock) -->
    <rect x="0" y="42" width="52" height="14" rx="1" fill="url(#tg)" opacity="0.6"/>
    <!-- Bottom diagonal -->
    <polygon points="52,42 72,56 52,56" fill="url(#tg)" opacity="0.4"/>
    <!-- Vertical spine -->
    <rect x="0" y="0" width="10" height="56" rx="1" fill="url(#tg)"/>
  </g>
  <!-- WORDMARK: KASHYAP BUILDERS -->
  <g transform="translate(88,0)">
    <text x="0" y="58"
      font-family="'Space Grotesk',sans-serif"
      font-weight="800" font-size="50"
      letter-spacing="-1.5" fill="url(#wg)">KASHYAP</text>
    <text x="2" y="80"
      font-family="'Space Grotesk',sans-serif"
      font-weight="400" font-size="15"
      letter-spacing="6" fill="#0f9580">BUILDERS</text>
    <!-- Teal accent underline under BUILDERS -->
    <rect x="2" y="84" width="40" height="1.5" rx="0.75" fill="#0f9580" opacity="0.5"/>
  </g>
</svg>
